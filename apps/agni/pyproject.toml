[project]
name = "agni"
version = "0.0.0"
description = "Terminal coding agent built on tantra"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Malay Hazarika", email = "malay.hazarika@gmail.com" }]
dependencies = ["tantra-harness>=0.1", "prompt_toolkit>=3.0"]

[project.scripts]
agni = "agni.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agni"]

[tool.uv.sources]
tantra-harness = { workspace = true }
