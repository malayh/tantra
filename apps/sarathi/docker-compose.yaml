x-backend: &backend
  image: ${SARATHI_BACKEND_IMAGE:-sarathi-backend:local}
  build:
    context: ../..
    dockerfile: apps/sarathi/backend/Dockerfile
  env_file: .env
  volumes:
    - uploads:${UPLOAD_DIR:-/data/uploads}
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
      ]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sarathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarathi}
      POSTGRES_DB: ${POSTGRES_DB:-sarathi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sarathi} -d ${POSTGRES_DB:-sarathi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "12501:5432"

  migrate:
    image: ${SARATHI_BACKEND_IMAGE:-sarathi-backend:local}
    build:
      context: ../..
      dockerfile: apps/sarathi/backend/Dockerfile
    working_dir: /app/apps/sarathi/backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend_a:
    <<: *backend

  backend_b:
    <<: *backend

  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "${SARATHI_API_PORT:-8001}:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend_a:
        condition: service_healthy
      backend_b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  ui:
    build:
      context: ./ui
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      API_URL_INTERNAL: http://nginx:8000
    ports:
      - "${SARATHI_UI_PORT:-3001}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  uploads:
