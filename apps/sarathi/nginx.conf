user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    log_format upstream '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                        'upstream=$upstream_addr upstream_status=$upstream_status request_time=$request_time';
    access_log /var/log/nginx/access.log upstream;
    error_log /dev/stderr crit;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream sarathi_backends {
        zone sarathi_backends 64k;
        server backend_a:8000 resolve max_fails=2 fail_timeout=5s;
        server backend_b:8000 resolve max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8000;
        client_max_body_size 24m;

        location / {
            proxy_pass http://sarathi_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
