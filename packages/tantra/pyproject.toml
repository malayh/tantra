[project]
name = "tantra"
version = "0.0.0"
description = "Agent harness framework — the turn loop as a library"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Malay Hazarika", email = "malay.hazarika@gmail.com" }]
dependencies = ["pydantic>=2.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tantra"]
